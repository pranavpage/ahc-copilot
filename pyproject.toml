[project]
name = "copilot"
version = "0.1.0"
description = "Asset Intelligence Copilot"
requires-python = ">=3.13,<3.14"
dependencies = [
    "deepeval>=4.3.1",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langgraph-cli[inmem]>=0.4.36",
    "plotly>=7.1.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copilot"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "evals"]
